services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - VITALIFE_API_PORT=8787
    ports:
      - "8787:8787"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - VITE_API_BASE_URL=http://localhost:8787
    ports:
      - "8080:80"
    depends_on:
      - api
